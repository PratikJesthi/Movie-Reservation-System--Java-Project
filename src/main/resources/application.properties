spring.application.name=chalchitra

# Default profile: Persistent local H2 database in file mode
spring.datasource.url=jdbc:h2:file:./data/moviedb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate update mode so data persists across restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable SQL script initialization; CommandLineRunner seeds data when database is empty
spring.sql.init.mode=never

# H2 Console
spring.h2.console.enabled=true

server.port=8080

# Razorpay (TEST mode) - read from environment variables; never hardcoded
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Application base URL (used in payment callback URL)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Payment simulation mode (strictly false by default; enable only explicitly via APP_PAYMENT_SIMULATION=true)
app.payment.simulation=${APP_PAYMENT_SIMULATION:false}

# Admin login brute-force throttle
# After max-attempts failures within window-minutes the endpoint returns 429.
# NOTE: counters reset on restart; use a shared store (Redis/DB) for multi-instance deployments.
app.admin.login.max-attempts=5
app.admin.login.window-minutes=15

# Mail configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

