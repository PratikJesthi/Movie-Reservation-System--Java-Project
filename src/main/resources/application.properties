spring.application.name=movie-reservation-system

# Supabase PostgreSQL connection. Set these environment variables before starting the app.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Create the tables with schema.sql in Supabase first; Hibernate only checks the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Avoid running schema.sql automatically: the schema is intended for the Supabase SQL editor.
spring.sql.init.mode=never

server.port=8080
