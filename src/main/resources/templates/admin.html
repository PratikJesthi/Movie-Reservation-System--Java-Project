<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin | CHALCHITRA</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body data-page="admin">
    <div th:replace="~{fragments/nav :: navigation}"></div>

    <main class="container narrow">

        <!-- Add Movie Section -->
        <section class="form-card">
            <p class="eyebrow">CATALOGUE</p>
            <h1>Add a movie</h1>
            <p class="muted">New movies appear on the home page.</p>

            <form id="movie-form">
                <label>
                    Title
                    <input name="title" maxlength="200" required>
                </label>

                <label>
                    Description
                    <textarea name="description" rows="4" required></textarea>
                </label>

                <div class="form-grid">
                    <label>
                        Genre
                        <input name="genre" maxlength="100" required>
                    </label>

                    <label>
                        Language
                        <input name="language" maxlength="80" required>
                    </label>
                </div>

                <div class="form-grid">
                    <label>
                        Release date
                        <span class="muted">(optional)</span>
                        <input name="releaseDate" type="date">
                    </label>

                    <label>
                        Certificate
                        <span class="muted">(optional)</span>
                        <select name="certificate">
                            <option value="">—</option>
                            <option>U</option>
                            <option>UA</option>
                            <option>A</option>
                        </select>
                    </label>
                </div>

                <label>
                    Duration in minutes
                    <input name="durationMinutes" type="number" min="1" required>
                </label>

                <label>
                    Poster image URL
                    <span class="muted">(optional)</span>
                    <input name="posterUrl" type="url" maxlength="1000">
                </label>

                <p id="form-message" class="form-message" role="alert"></p>

                <button class="button" type="submit">Add movie</button>
            </form>
        </section>

        <!-- Add Showtime Section -->
        <section class="form-card">
            <p class="eyebrow">SCHEDULE</p>
            <h1>Add a showtime</h1>
            <p class="muted">
                A new movie can't be booked until it has a showtime.
            </p>

            <form id="show-form">
                <label>
                    Movie
                    <select name="movieId" required></select>
                </label>

                <label>
                    Screen
                    <select name="screenId" required></select>
                </label>

                <div class="form-grid">
                    <label>
                        Date and time
                        <input name="showTime" type="datetime-local" required>
                    </label>

                    <label>
                        Ticket price (₹)
                        <input name="price" type="number" min="1" step="0.01" required>
                    </label>
                </div>

                <p id="show-message" class="form-message" role="alert"></p>

                <button class="button" type="submit">Add showtime</button>
            </form>
        </section>

    </main>

    <script src="/js/app.js" defer></script>
</body>

</html>
