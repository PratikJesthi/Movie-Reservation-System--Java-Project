<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | ReelReserve</title><link rel="stylesheet" href="/css/styles.css"></head>
<body data-page="register"><div th:replace="~{fragments/nav :: navigation}"></div>
<main class="container narrow"><section class="form-card"><p class="eyebrow">JOIN REELRESERVE</p><h1>Create an account</h1><p class="muted">A few details and you're ready to book.</p>
    <form id="register-form"><label>Name<input name="name" autocomplete="name" maxlength="100" required></label>
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required><small>Use at least 8 characters.</small></label>
        <p id="form-message" class="form-message" role="alert"></p><button class="button" type="submit">Create account</button></form>
    <p class="form-footnote">Already registered? <a href="/login">Log in</a></p></section></main>
<script src="/js/app.js" defer></script></body></html>
