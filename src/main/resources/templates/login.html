<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | ReelReserve</title><link rel="stylesheet" href="/css/styles.css"></head>
<body data-page="login"><div th:replace="~{fragments/nav :: navigation}"></div>
<main class="container narrow"><section class="form-card"><p class="eyebrow">WELCOME BACK</p><h1>Log in</h1><p class="muted">Sign in to manage your bookings.</p>
    <form id="login-form"><label>Email<input name="email" type="email" autocomplete="email" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <p id="form-message" class="form-message" role="alert"></p><button class="button" type="submit">Log in</button></form>
    <p class="form-footnote">New here? <a href="/register">Create an account</a></p></section></main>
<script src="/js/app.js" defer></script></body></html>
